<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Alata&family=Inter:wght@400;500;600&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<!-- pin this to a real version from npmjs.com/package/lucide before shipping -->
<script src="https://unpkg.com/lucide@0.525.0"></script>
<title>Resolve</title>
<link rel="stylesheet" href="./css/user-dashboard.css" />
</head>

<body>

<div class="sidebarBackdrop"></div>

<main>
<aside class="topAside">
    <section class="sidebar">
    <div class="sidebarLogo">
      <svg width="140" height="35" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Resolve">
        <rect x="0" y="0" width="60" height="60" rx="14" fill="#0F766E"/>
        <text x="30" y="42" font-family="'Josefin Sans', sans-serif" font-weight="600" font-size="34" fill="#FFFFFF" text-anchor="middle">R</text>
        <text x="70" y="41" font-family="'Josefin Sans', sans-serif" font-weight="600" font-size="34" letter-spacing="0.5" fill="#171717">esolve</text>
      </svg>

      <button type="button" class="sidebarClose" aria-label="Close menu"><i data-lucide="x"></i></button>
    </div>

    <nav class="sidebarNav">
      <a href="./user-dashboard.html" class="navItem"><i data-lucide="layout-dashboard"></i>Dashboard</a>
      <a href="./user-complaints.html" class="navItem"><i data-lucide="clipboard-list"></i>My Complaints</a>
      <a href="./user-profile.html" class="navItem"><i data-lucide="user"></i>My Profile</a>
    </nav>

    <a href="./logout.html" class="navItem logoutItem"><i data-lucide="log-out"></i>Logout</a>
    </section>
</aside>

<nav>
    <div class="navLeft">
        <button type="button" class="hamburger" aria-label="Open menu" aria-expanded="false">
        <i data-lucide="menu"></i>
    </button>
        <svg width="110" height="28" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Resolve" class="navLogo">
            <rect x="0" y="0" width="60" height="60" rx="14" fill="#0F766E"/>
            <text x="30" y="42" font-family="'Josefin Sans', sans-serif" font-weight="600" font-size="34" fill="#FFFFFF" text-anchor="middle">R</text>
            <text x="70" y="41" font-family="'Josefin Sans', sans-serif" font-weight="600" font-size="34" letter-spacing="0.5" fill="#171717">esolve</text>
        </svg>
    </div>

    <div class="profile">
        <i data-lucide="user" class="userPic"></i>

        <div class="profileInfo">
            <h3 class="username"></h3>
            <p class="role">Resident</p>
        </div>
    </div>
</nav>

<section class="userProfile">
    <h1>My Profile</h1>

    <form class="profileCard" id="profileForm">
        <div class="avatarRow">
            <div class="avatarWrap">
                <i data-lucide="circle-user" class="profileAvatar"></i>
                <button type="button" class="avatarUpload" aria-label="Upload profile photo">
                    <i data-lucide="camera"></i>
                </button>
            </div>
            <div class="avatarText">
                <h3 class="avatarName"></h3>
                <p class="avatarRole">Resident</p>
            </div>
        </div>

        <div class="formGrid">
            <div class="formGroup">
                <label for="profileName">Full Name</label>
                <input type="text" id="profileName" required />
            </div>

            <div class="formGroup">
                <label for="profileEmail">Email</label>
                <input type="email" id="profileEmail" required />
            </div>

            <div class="formGroup">
                <label for="profileBuilding">Building / Hall</label>
                <input type="text" id="profileBuilding" required />
            </div>

            <div class="formGroup">
                <label for="profileUnit">Unit / Room #</label>
                <input type="text" id="profileUnit" required />
            </div>

            <div class="formGroup">
                <label for="profilePhone">Phone Number</label>
                <input type="tel" id="profilePhone" placeholder="080X XXX XXXX" />
            </div>
        </div>

        <p class="formMessage" role="alert" aria-live="polite"></p>
        <div class="profileActions">
            <a href="./change-password.html" class="changePassword">Change Password</a>
            <button type="submit" class="saveProfile">Save Changes</button>
        </div>
    </form>
</section>


<script src="./js/api.js"></script>
<script src="./js/sidebar.js"></script>
<script src="./js/user-profile.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
