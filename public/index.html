      <section class="formContainer">
        <aside class="switchForm">
          <button class="loginSwitch active" data-form="Login">Login</button>
          <button class="signupSwitch" data-form="Signup">Signup</button>
        </aside>

        <form id="loginForm" class="">
          <h2>Welcome Back</h2>
          <p>Please enter your details to sign in.</p>

          <div class="form-group">
            <label for="loginName">Full Name / Email</label>
            <input type="text" id="loginName" placeholder="John Doe" required />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input
              type="password"
              id="loginPassword"
              placeholder="••••••••"
              required
            />
          </div>

          <p class="formMessage" role="alert" aria-live="polite"></p>
          <button type="submit" class="btn-primary">Login</button>
        </form>

        <form id="signupForm" class="hidden">
          <h2>Create Account</h2>

          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input
              type="text"
              id="signupName"
              placeholder="Jane Doe"
              required
            />
          </div>

          <aside class="form-row">
            <div class="form-group">
              <label for="buildingInput">Building / Hall</label>
              <input
                type="text"
                id="buildingInput"
                placeholder="John Hall"
                required
              />
            </div>

            <div class="form-group">
              <label for="unitInput">Unit / Room #</label>
              <input type="text" id="unitInput" placeholder="4B" required />
            </div>
          </aside>

          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input
              type="email"
              id="signupEmail"
              placeholder="jane@estate.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input
              type="password"
              id="signupPassword"
              placeholder="••••••••"
              required
            />
          </div>

          <p class="formMessage" role="alert" aria-live="polite"></p>
          <button type="submit" class="btn-primary">Create Account</button>
        </form>
      </section>
